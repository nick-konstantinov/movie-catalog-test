<div class="movies-wrapper">
  @if (loading && !(movies$ | async)?.length) {
    <div class="loader">
      <div class="spinner"></div>
    </div>
  }

  @if ((movies$ | async)?.length) {
    <div class="movies-grid">
      @for (movie of movies$ | async; track movie.id) {
        <app-movie-card [movie]="movie"></app-movie-card>
      }
    </div>

    @if (page$.value < totalPages) {
      <div class="load-more">
        <button mat-raised-button (click)="loadNextPage()" [disabled]="loading">
          @if (loading) { Загрузка... } @else { Загрузить ещё }
        </button>
      </div>
    }
  }

  @if (showScrollTop$ | async) {
    <button
      class="scroll-top-btn"
      type="button"
      (click)="scrollToTop()"
    >
      <span class="scroll-top-btn__icon">↑</span>
    </button>
  }
</div>

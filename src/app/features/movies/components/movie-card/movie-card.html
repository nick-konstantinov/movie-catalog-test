<div class="card" (click)="openDialog()">
  <img
    class="card__poster"
    [src]="poster"
    [alt]="movie.title"
    loading="lazy"
  />

  <div class="card__info">
    <h3 class="card__title">
      {{ movie.title }}
    </h3>

    <span class="card__year">
      {{ year }}
    </span>
  </div>
</div>
